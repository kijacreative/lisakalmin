<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="ads.css"><title>R3 included</title>
<style>
body{background:var(--forest);color:var(--oat)}
.ad{gap:26px}
.eyebrow{color:var(--rose-l)}
.big{font-family:var(--display);font-weight:800;font-size:250px;line-height:.85;letter-spacing:-.06em;color:var(--rose-l)}
.h{font-size:96px;color:var(--oat)}
.d{font-size:40px;line-height:1.3;color:var(--sage);max-width:860px}
.row{display:flex;justify-content:space-between;align-items:flex-end;gap:20px}
.dots{display:flex;gap:12px}.dots i{width:14px;height:14px;border-radius:50%;background:#56635B}.dots i.on{background:var(--rose-l)}
.brand{color:var(--sage)}
.light{background:var(--oat);color:var(--forest)}
.light .h{color:var(--forest)} .light .d{color:var(--mid)} .light .eyebrow{color:var(--rose)} .light .big{color:var(--rose)}
.light .dots i{background:var(--rule)} .light .dots i.on{background:var(--rose)}
.price{display:flex;align-items:baseline;gap:24px}
.price s{font-size:64px;color:var(--mid);font-weight:500}
.chip{display:inline-block;padding:12px 26px;border:3px dashed var(--rose);border-radius:14px;font-size:40px;font-weight:700;letter-spacing:.1em;color:var(--rose);width:fit-content}
</style></head><body class="square"><div class="ad" id="ad"></div>
<script>
var C=[
 {big:'6',e:'Money Wealth and Miracles',h:'live sessions with Lisa',d:'Dec 14 to Feb 11 · 90 minutes each · every session recorded'},
 {big:'Live',e:'In every session',h:'coaching, in real time',d:'Bring your real questions. Lisa coaches you on the spot, and you learn from everyone else’s breakthroughs too.'},
 {big:'Weekly',e:'Between sessions',h:'breakthrough assignments',d:'Short, practical work that puts each shift to use in your real life and money.'},
 {big:'1',e:'Your group',h:'private WhatsApp circle',d:'Your Co-Miracle Makers, sharing wins and questions all the way through February.'},
 {light:1,e:'Enrollment open',h:'Starts Monday, December 14',d:'5:30 pm PT on Zoom. A small group of 15 to 30, so Lisa can coach you directly.',cta:'Save my seat →'},
 {light:1,code:1,e:'Until Dec 14 at 5:30 pm PT',d:'Paid in full. We begin Monday, December 14, and the price ends when we start.',cta:'Join for $597 →'}];
var i=+(location.hash.slice(1)||0), c=C[i], el=document.getElementById('ad');
if(c.light) document.body.classList.add('light');
var n=Math.min(i,4), dots='<div class="dots">'+[0,1,2,3,4].map(function(k){return '<i class="'+(k==n?'on':'')+'"></i>'}).join('')+'</div>';
var eb='<p class="eyebrow">'+c.e+'</p>';
var mid=c.code?'<div class="price"><span class="big" style="font-size:200px">$597</span><s>$797</s></div><span class="chip">MIRACLE200</span>'
 :(c.big?'<p class="big">'+c.big+'</p><h1 class="h">'+c.h+'</h1>':'<h1 class="h" style="font-size:112px">'+c.h+'</h1>');
el.innerHTML=eb+'<div class="spacer"></div>'+mid+'<p class="d">'+c.d+'</p><div class="row" style="margin-top:14px">'+(c.cta?'<span class="pill">'+c.cta+'</span>':dots)+(i==0?'<span style="font-size:30px;font-weight:700;color:var(--rose-l)">Swipe →</span>':'')+'</div>';
</script></body></html>
