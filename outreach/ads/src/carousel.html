<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="ads.css"><title>L1 carousel</title>
<style>
body{background:var(--oat);color:var(--forest)}
.ad{gap:30px}
.eyebrow{color:var(--rose)}
.h{font-size:118px;color:var(--forest)}
.d{font-size:40px;line-height:1.3;color:var(--mid);max-width:840px}
.num{font-family:var(--display);font-weight:800;font-size:200px;line-height:.8;color:var(--blush);letter-spacing:-.05em}
.row{display:flex;justify-content:space-between;align-items:flex-end}
.swipe{font-size:30px;font-weight:700;color:var(--rose)}
.dark{background:var(--forest);color:var(--oat)}
.dark .h{color:var(--oat)} .dark .d{color:var(--sage)} .dark .eyebrow{color:var(--rose-l)}
.dots{display:flex;gap:12px}.dots i{width:14px;height:14px;border-radius:50%;background:var(--rule)}.dots i.on{background:var(--rose)}
</style></head><body class="square"><div class="ad" id="ad"></div>
<script>
var C=[
 {dark:1,e:'Free scorecard · 5 minutes',h:'Which money pattern are you running?',d:'Four patterns shape how money comes, stays and goes. Swipe to meet them.'},
 {n:'1',e:'Pattern 1',h:'Money Manifester',d:'Proactive, sees opportunity in challenges, and senses there’s another level to reach.'},
 {n:'2',e:'Pattern 2',h:'Money Manager',d:'Sometimes gets past the obstacles, and still worries about money even when it’s there.'},
 {n:'3',e:'Pattern 3',h:'Money Unaware',d:'Works hard, but feels disconnected from money and too busy to look at it.'},
 {n:'4',e:'Pattern 4',h:'Money Resigned',d:'Feels the system is stacked against them, and stuck in the same financial loop.'},
 {dark:1,e:'Lisa Kalmin · 39 years of coaching',h:'Find yours in 5 minutes.',d:'30 quick statements and your pattern appears right away. Free.',cta:1}];
var i=+(location.hash.slice(1)||0), c=C[i], el=document.getElementById('ad');
if(c.dark) document.body.classList.add('dark');
var dots='<div class="dots">'+C.map(function(_,k){return '<i class="'+(k==i?'on':'')+'"></i>'}).join('')+'</div>';
el.innerHTML=(c.n?'<div class="row"><p class="eyebrow">'+c.e+'</p><p class="num">'+c.n+'</p></div>':'<p class="eyebrow">'+c.e+'</p>')+
 '<div class="spacer"></div><h1 class="h" style="'+(c.n?'':'font-size:104px')+'">'+c.h+'</h1><p class="d">'+c.d+'</p>'+
 '<div class="row" style="margin-top:20px">'+(c.cta?'<span class="pill">Take the scorecard →</span>':dots)+(i==0?'<span class="swipe">Swipe →</span>':'')+'</div>';
</script></body></html>
