<h1 class="h">A great month. A slow one. <em>Again.</em></h1>

 <line x1="20" x2="880" y1="250" y2="250" stroke="#A04E5C" stroke-width="4" stroke-dasharray="14 12"/>

 <path d="M20 250 C 80 250, 100 90, 160 90 S 230 300, 290 280 S 360 250, 400 250 C 450 250, 470 60, 540 60 S 620 300, 680 285 S 750 250, 800 250 L 880 250" fill="none" stroke="#2F3B33" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>

<p class="lead">An old money story quietly says “this far and no further.” The free scorecard shows the pattern behind it.</p>
