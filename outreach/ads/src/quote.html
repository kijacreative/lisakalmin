<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="ads.css"><title>L4 quote</title>
<style>
body{background:var(--forest);color:var(--oat)}
.ad{padding:0;flex-direction:column}
.photo{position:relative;flex:0 0 46%;overflow:hidden}
.photo img{width:100%;height:100%;object-fit:cover;object-position:50% 18%}
.photo::after{content:"";position:absolute;inset:auto 0 0 0;height:40%;background:linear-gradient(to bottom,transparent,var(--forest))}
.text{flex:1;display:flex;flex-direction:column;gap:30px;padding:10px 84px 76px;position:relative}
.q{font-family:var(--display);font-weight:800;font-size:74px;line-height:1.08;letter-spacing:-.03em;color:var(--oat);text-wrap:balance}
.q span{color:var(--rose-l)}
.mark{font-family:var(--display);font-size:150px;line-height:.5;color:var(--rose-l);height:60px}
.who{font-size:30px;color:var(--sage)}
.who b{color:var(--oat)}
.row{display:flex;justify-content:space-between;align-items:center;gap:20px}
.small{font-size:28px;color:var(--sage)}
.story .ad{padding:0}.story .photo{flex-basis:52%}
.story .text{padding-bottom:400px}
</style></head><body><div class="ad">
<div class="photo"><img src="../../../img/portrait-light.jpg" alt=""></div>
<div class="text">

<p class="q">Most people are worth <span>more than they let themselves receive.</span></p>
<p class="who"><b>Lisa Kalmin</b> · transformational coach, 39 years</p>
<div class="spacer"></div>
<div class="row"><span class="small">Free scorecard · 5 minutes</span><span class="pill">See my pattern →</span></div>
</div></div><script>document.body.className=innerHeight/innerWidth>1.5?'story':'feed'</script></body></html>
