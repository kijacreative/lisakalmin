<!doctype html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:v="urn:schemas-microsoft-com:vml" xmlns:o="urn:schemas-microsoft-com:office:office">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="x-apple-disable-message-reformatting">
<meta name="color-scheme" content="light">
<meta name="supported-color-schemes" content="light">
<title>Lisa Kalmin</title>
<!--
  Kit custom email template for Lisa Kalmin (Kit > Send > Email Templates > New > HTML).
  Every broadcast and sequence email drops into {{ message_content }}, so the words stay
  editable in Kit's editor. The frame (logo, card, sign-off area, footer) lives here.

  In the Kit editor:
    Paragraph        -> body text
    Heading 1 / 2    -> brand headings (Plus Jakarta Sans, forest green)
    Heading 3        -> small rose label in capitals (use it above a box or a section)
    Button           -> rose pill button
    Quote            -> blush box with a rose edge (good for the masterclass date/time box)
    Divider          -> thin sage rule
    Image            -> rounded, full width
  Variables you can type in the editor: {{ subscriber.first_name | default: "there" }}
-->
<!--[if mso]><noscript><xml><o:OfficeDocumentSettings><o:PixelsPerInch>96</o:PixelsPerInch></o:OfficeDocumentSettings></xml></noscript><![endif]-->
<link href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,400;0,500;0,700;1,400&family=Plus+Jakarta+Sans:wght@800&display=swap" rel="stylesheet">
<style>
  body{margin:0;padding:0;width:100%!important;background:#F8F4EC;-webkit-text-size-adjust:100%;-ms-text-size-adjust:100%}
  table{border-collapse:collapse;mso-table-lspace:0;mso-table-rspace:0}
  img{border:0;outline:none;text-decoration:none;-ms-interpolation-mode:bicubic}

  /* the editable message */
  .content{font-family:'Jost',Helvetica,Arial,sans-serif;font-size:18px;line-height:28px;color:#232C26}
  .content p{margin:0 0 18px}
  .content h1,.content h2{font-family:'Plus Jakarta Sans',Helvetica,Arial,sans-serif;font-weight:800;color:#2F3B33;letter-spacing:-0.4px;margin:0 0 14px}
  .content h1{font-size:30px;line-height:36px}
  .content h2{font-size:23px;line-height:30px;margin-top:8px}
  .content h3{font-family:'Jost',Helvetica,Arial,sans-serif;font-size:12px;line-height:16px;letter-spacing:3px;text-transform:uppercase;font-weight:500;color:#A04E5C;margin:8px 0 10px}
  .content h4{font-size:18px;line-height:26px;font-weight:700;color:#2F3B33;margin:0 0 8px}
  .content a{color:#A04E5C;font-weight:700;text-decoration:underline}
  .content strong,.content b{color:#2F3B33}
  .content ul,.content ol{margin:0 0 18px;padding-left:24px}
  .content li{margin:0 0 8px}
  .content blockquote{margin:6px 0 24px;padding:22px 26px;background:#F1DCDF;border-left:4px solid #A04E5C;border-radius:0 14px 14px 0;color:#2F3B33;font-size:17px;line-height:26px}
  .content blockquote p:last-child{margin-bottom:0}
  .content hr{border:0;border-top:1px solid #C9D1C1;margin:28px 0}
  .content img{max-width:100%!important;height:auto!important;border-radius:14px}
  /* Kit buttons, whichever markup the editor uses */
  .content a.btn,.content a.button,.content .button a,.content .btn a,.content a[class*="button"],.content td[class*="button"] a{display:inline-block;padding:15px 32px;border-radius:999px;background:#A04E5C!important;border:0;color:#F8F4EC!important;font-family:'Jost',Helvetica,Arial,sans-serif;font-size:17px;line-height:20px;font-weight:700;text-decoration:none!important}
  .content td[class*="button"],.content table[class*="button"] td{background:#A04E5C!important;border-radius:999px}

  .foot a{color:#56635B;text-decoration:underline}
  @media (max-width:620px){
    .container{width:100%!important}
    .px{padding-left:22px!important;padding-right:22px!important}
    .content{font-size:17px!important;line-height:27px!important}
    .content h1{font-size:27px!important;line-height:33px!important}
  }
</style>
</head>
<body style="margin:0;padding:0;background:#F8F4EC;">

<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#F8F4EC" style="background:#F8F4EC;">
<tr><td align="center" style="padding:24px 10px;">

<table role="presentation" class="container" width="600" cellpadding="0" cellspacing="0" border="0" style="width:600px;max-width:600px;">

<!-- logo -->
<tr><td class="px" style="padding:8px 40px 20px;">
<a href="https://masterclass.lisakalmin.com/" style="text-decoration:none;"><img src="https://masterclass.lisakalmin.com/email/logo-email.png" width="180" height="30" alt="Lisa Kalmin" style="display:block;width:180px;height:auto;font-family:'Jost',Helvetica,Arial,sans-serif;font-size:22px;font-weight:700;letter-spacing:1px;color:#2F3B33;"></a>
</td></tr>

<!-- message: edited in Kit -->
<tr><td bgcolor="#FDFBF7" class="px content" style="background:#FDFBF7;border-radius:18px;padding:36px 40px 22px;font-family:'Jost',Helvetica,Arial,sans-serif;font-size:18px;line-height:28px;color:#232C26;">
{{ message_content }}
</td></tr>

<!-- footer -->
<tr><td class="px foot" style="padding:26px 40px 8px;font-family:'Jost',Helvetica,Arial,sans-serif;font-size:13px;line-height:20px;color:#56635B;text-align:center;">
<p style="margin:0 0 8px;">You’re receiving this at {{ subscriber.email_address }} because you joined Lisa Kalmin’s list.</p>
<p style="margin:0 0 8px;"><a href="{{ unsubscribe_url }}" style="color:#56635B;text-decoration:underline;">Unsubscribe</a> &nbsp;·&nbsp; <a href="{{ subscriber_preferences_url }}" style="color:#56635B;text-decoration:underline;">Update your preferences</a></p>
<p style="margin:0;">{{ address }}</p>
</td></tr>

</table>
</td></tr>
</table>
</body>
</html>
